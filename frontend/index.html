<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="\src\assets\logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('furniture_theme') || 'light';
          var lang = localStorage.getItem('furniture_language') || 'en';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
          root.setAttribute('data-lang', lang === 'ta' ? 'ta' : 'en');
          root.setAttribute('lang', lang === 'ta' ? 'ta' : 'en');
        } catch (e) {}
      })();
    </script>
    <title>Varnam Heritage Woodcraft | Handcrafted Luxury Wooden Furniture</title>
    <meta name="description" content="Bespoke handcrafted solid wood furniture combining timeless traditional joinery with refined contemporary living. Explore curated collections and connect directly on WhatsApp." />
    
    <!-- Google Fonts: Cormorant Garamond, Manrope, Noto Sans Tamil, Noto Serif Tamil -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Noto+Serif+Tamil:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
